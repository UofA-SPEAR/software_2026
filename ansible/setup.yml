- name: "Set up ROS2 environment"
  hosts: localhost
  become: yes
  vars:
    ROS_VERSION: "1.1.0"
    MAC_ADDRESS: "FF:FF:FF:FF:FF:FF"  # Replace with actual MAC address of the network interface to be used for EtherCAT
  tasks:
    - name: "Install Python3"
      apt:
        name:
          - python3
          - python3-pip
    - name: "Setup ROS2 Repository"
      block:
        - name: "Remove conflicting ROS2 source files"
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /tmp/ros2-apt-source.deb
            - /etc/apt/sources.list.d/ros2-latest.sources
            - /etc/apt/sources.list.d/ros2.sources
        - name: "Get Ubuntu Codename"
          ansible.builtin.shell: |
            . /etc/os-release && echo ${UBUNTU_CODENAME:-${VERSION_CODENAME}}
          register: ubuntu_codename
        - name: "Add ROS2 APT repository"
          ansible.builtin.get_url:
            url: "https://github.com/ros-infrastructure/ros-apt-source/releases/download/{{ ROS_VERSION }}/ros2-apt-source_{{ ROS_VERSION}}.{{ ubuntu_codename.stdout }}_all.deb"
            dest: /tmp/ros2-apt-source.deb
        - name: "Remove old apt cache"
          ansible.builtin.command:
            cmd: rm -f /var/lib/apt/lists/lock
          ignore_errors: yes
        - name: "Install ROS2 APT source package"
          ansible.builtin.apt:
            deb: /tmp/ros2-apt-source.deb
        - name: "Update APT cache"
          ansible.builtin.apt:
            update_cache: yes
    - name: "Install ROS2 packages"
      ansible.builtin.apt:
        name:
          - ros-dev-tools
          - ros-humble-desktop
    - name: "Install python packages"
      ansible.builtin.pip:
        name:
          - colcon-common-extensions
    - name: Install Gazebo Ignition Fortress
      block:
        - name: Install lsb-release and gnupg
          ansible.builtin.apt:
            name:
              - lsb-release
              - gnupg
            state: present
            update_cache: yes

        - name: Download Gazebo GPG key
          ansible.builtin.get_url:
            url: https://packages.osrfoundation.org/gazebo.gpg
            dest: /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg
            mode: '0644'

        - name: Get system architecture
          ansible.builtin.command: dpkg --print-architecture
          register: system_arch
          changed_when: false

        - name: Get Ubuntu codename
          ansible.builtin.command: lsb_release -cs
          register: ubuntu_codename
          changed_when: false

        - name: Add Gazebo stable repository
          ansible.builtin.apt_repository:
            repo: "deb [arch={{ system_arch.stdout }} signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] https://packages.osrfoundation.org/gazebo/ubuntu-stable {{ ubuntu_codename.stdout }} main"
            filename: gazebo-stable
            state: present

        - name: Update apt cache
          ansible.builtin.apt:
            update_cache: yes

        - name: Install Ignition Fortress
          ansible.builtin.apt:
            name: ignition-fortress
            state: present
        - name: Install Gazebo bridge
          ansible.builtin.apt:
            name: ros-humble-ros-gz
            state: present
    - name: "Install ros2_control"
      ansible.builtin.apt:
        name:
          - ros-humble-ros2-control
          - ros-humble-ros2-controllers
    - name: "Install ethercat_driver_ros2" # https://icube-robotics.github.io/ethercat_driver_ros2/quickstart/installation.html
      tags: ethercat
      block:
        - name: "Install required tools"
          ansible.builtin.apt:
            name:
              - git
              - autoconf
              - libtool
              - pkg-config
              - make
              - build-essential
              - net-tools
              - linux-headers-generic
        - name: "Clone repository"
          ansible.builtin.git:
            repo: "https://gitlab.com/etherlab.org/ethercat.git"
            dest: "/tmp/ethercat"
            clone: yes
            update: yes

    - name: "Remove existing ethercat binaries and init scripts"
      tags: ethercat
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/bin/ethercat
        - /etc/init.d/ethercat

    - name: "Run bootstrap"
      tags: ethercat
      ansible.builtin.command:
        cmd: ./bootstrap
        chdir: /tmp/ethercat
        creates: /tmp/ethercat/configure

    - name: "Configure EtherCAT"
      tags: ethercat
      ansible.builtin.command:
        cmd: ./configure --prefix=/usr/local/etherlab --disable-8139too --disable-eoe --enable-generic --disable-kernel
        chdir: /tmp/ethercat
        creates: /tmp/ethercat/Makefile

    - name: "Build EtherCAT"
      tags: ethercat
      ansible.builtin.command:
        cmd: make all
        chdir: /tmp/ethercat

    - name: "Install EtherCAT modules"
      tags: ethercat
      ansible.builtin.command:
        cmd: make install
        chdir: /tmp/ethercat
      become: yes

    - name: "Create symlink for ethercat binary"
      tags: ethercat
      ansible.builtin.file:
        src: /usr/local/etherlab/bin/ethercat
        dest: /usr/bin/ethercat
        state: link

    - name: "Create symlink for ethercat init script"
      tags: ethercat
      ansible.builtin.file:
        src: /usr/local/etherlab/etc/init.d/ethercat
        dest: /etc/init.d/ethercat
        state: link

    - name: "Create /etc/sysconfig directory"
      tags: ethercat
      ansible.builtin.file:
        path: /etc/sysconfig
        state: directory
        mode: '0755'

    - name: "Copy ethercat sysconfig file"
      tags: ethercat
      ansible.builtin.copy:
        src: /usr/local/etherlab/etc/sysconfig/ethercat
        dest: /etc/sysconfig/ethercat
        remote_src: yes

    - name: "Create udev rule for EtherCAT"
      tags: ethercat
      ansible.builtin.copy:
        content: 'KERNEL=="EtherCAT[0-9]*", MODE="0666"'
        dest: /etc/udev/rules.d/99-EtherCAT.rules
        mode: '0644'

    - name: "Reload udev rules"
      tags: ethercat
      ansible.builtin.command:
        cmd: udevadm control --reload-rules

    - name: "Configure EtherCAT network adapter"
      tags: ethercat
      ansible.builtin.lineinfile:
        path: /etc/sysconfig/ethercat
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: '^MASTER0_DEVICE=', line: 'MASTER0_DEVICE="{{ MAC_ADDRESS }}"' }
        - { regexp: '^DEVICE_MODULES=', line: 'DEVICE_MODULES="generic"' }
      # notify: restart ethercat

  # handlers:
  #   - name: restart ethercat
  #     ansible.builtin.service:
  #       name: ethercat
  #       state: restarted