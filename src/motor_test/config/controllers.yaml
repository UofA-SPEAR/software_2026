controller_manager:
  ros__parameters:
    update_rate: 100
    
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    
    motor_controller:
      type: forward_command_controller/ForwardCommandController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - motor_joint
    map_interface_to_joint_state:
      position: Feedback

motor_controller:
  ros__parameters:
    joints:
      - motor_joint
    interface_name: Target_PWM