# Slave config for ZeroErr eRob EtherCAT joint module
# Vendor ID: 0x5A65726F ("Zero" in ASCII) — from eRob manual 0x1018:01h
# Product code: 0x26483052 — from eRob manual 0x1018:02h
#
# PDO mapping matches the eRob default ESI file exactly:
# RxPDO 0x1600: Target Position, Digital outputs, Control Word
# TxPDO 0x1A00: Position Actual Value, Digital inputs, Status Word

vendor_id: 0x5A65726F
product_id: 0x00029252

# DC Sync0 — required for eRob to transition to SAFEOP/OP
# Without this the drive refuses state change with AL 0x001E "Invalid input configuration"
assign_activate: 0x0300

auto_fault_reset: true

# No startup SDOs — clear battery fault manually before launching:
#   ethercat download --position 0 --type uint16 0x2242 0 0x0001
#   sleep 2
#   ros2 launch motor_test erob_motor_launch.py
sdo:
  - {index: 0x1C32, sub_index: 1, type: uint16, value: 2}       # SM2 sync type = DC Sync0
  - {index: 0x1C32, sub_index: 10, type: uint32, value: 1000000}  # SM2 cycle time = 1ms (recommended by eRob manual)
  - {index: 0x1C33, sub_index: 1, type: uint16, value: 2}       # SM3 sync type = DC Sync0
  - {index: 0x1C33, sub_index: 10, type: uint32, value: 1000000}  # SM3 cycle time = 1ms

# RxPDO (0x1600) — matches eRob default ESI exactly
rpdo:
  - index: 0x1600
    channels:
      - {index: 0x607A, sub_index: 0, type: int32,  command_interface: position, default: .nan}  # Target Position
      - {index: 0x60FE, sub_index: 0, type: uint32, default: 0}                                   # Digital outputs
      - {index: 0x6040, sub_index: 0, type: uint16, default: 0}                                   # Control Word

# TxPDO (0x1A00) — matches eRob default ESI exactly
tpdo:
  - index: 0x1A00
    channels:
      - {index: 0x6064, sub_index: 0, type: int32,  state_interface: position}  # Position Actual Value
      - {index: 0x60FD, sub_index: 0, type: uint32}                              # Digital inputs
      - {index: 0x6041, sub_index: 0, type: uint16}                              # Status Word

# Sync Managers
sm:
  - {index: 0, type: output, pdo: null}
  - {index: 1, type: input,  pdo: null}
  - {index: 2, type: output, pdo: rpdo, watchdog: true}
  - {index: 3, type: input,  pdo: tpdo, watchdog: false}