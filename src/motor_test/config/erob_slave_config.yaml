# Slave config for ZeroErr eRob EtherCAT joint module
# Vendor ID: 0x5A65726F ("Zero" in ASCII) — from eRob manual 0x1018:01h
# Product code: 0x26483052 — from eRob manual 0x1018:02h
#
# Uses EcCiA402Drive plugin which auto-manages CiA402 state machine
# (PREOP -> SAFEOP -> OP -> OPERATION_ENABLED)

vendor_id: 0x5A65726F
product_id: 0x26483052

auto_fault_reset: true  # Set false if you want manual fault reset via reset_fault interface

# SDO writes at startup — add entries here if you need to configure
# gear ratio, encoder resolution, interpolation time, etc.
# Example: - {index: 0x60C2, sub_index: 1, type: int8, value: 10}  # 10ms interp time
sdo: []

# RxPDO (0x1600) — master sends to slave
# Default eRob mapping: Target position, Digital outputs, Control word
# NOTE: The CiA402 driver automatically handles the control word.
rpdo:
  - index: 0x1600
    channels:
      - {index: 0x6040, sub_index: 0, type: uint16, default: 0}                      # Control word (managed by EcCiA402Drive)
      - {index: 0x607A, sub_index: 0, type: int32, command_interface: position, default: .nan}  # Target position
      - {index: 0x60FF, sub_index: 0, type: int32, default: 0}                        # Target velocity (needed for CSP mode even if unused)

# TxPDO (0x1A00) — slave sends to master
# Default eRob mapping: Position actual value, Digital inputs, Status word
tpdo:
  - index: 0x1A00
    channels:
      - {index: 0x6064, sub_index: 0, type: int32,  state_interface: position}   # Position actual value
      - {index: 0x606C, sub_index: 0, type: int32,  state_interface: velocity}   # Velocity actual value (from 0x1A03 layout, added here)
      - {index: 0x6041, sub_index: 0, type: uint16}                               # Status word (managed by EcCiA402Drive)

# Sync Managers
# SM0: output mailbox, SM1: input mailbox (no PDO)
# SM2: output process data (RxPDO from master perspective)
# SM3: input process data (TxPDO from master perspective)
sm:
  - {index: 0, type: output, pdo: null}
  - {index: 1, type: input,  pdo: null}
  - {index: 2, type: output, pdo: rpdo, watchdog: true}
  - {index: 3, type: input,  pdo: tpdo, watchdog: false}